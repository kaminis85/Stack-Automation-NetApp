---
- name: Delete autogenerated ONTAP Default broadcast domains
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Get broadcast domains
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - network/ethernet/broadcast-domains
        fields:
          - name
          - ipspace
          - ports
      register: domain_info
      no_log: true

    - name: Get Ethernet ports
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - network/ethernet/ports
        fields:
          - name
          - node
          - broadcast_domain
          - service_policy
      register: port_info
      no_log: true

    - name: Record cluster and node-management ports
      ansible.builtin.set_fact:
        protected_ports: "{{ protected_ports | default([]) + [port_key] }}"
      vars:
        policy_name: "{{ (item.service_policy | default({})).name | default('') }}"
        ipspace_name: >-
          {{
            ((item.broadcast_domain | default({})).ipspace | default({})).name
            | default('')
          }}
        port_key: "{{ (item.node | default({})).name | default('') }}/{{ item.name }}"
      when: >-
        policy_name in ['default-management', 'default-cluster']
        or item.name == 'e0M'
        or ipspace_name == 'Cluster'
      loop: "{{ port_info.ontap_info.network_ethernet_ports.records | default([]) }}"
      loop_control:
        label: "{{ item.name | default('unnamed port') }}"

    - name: Select autogenerated Default broadcast domains that have no protected ports
      ansible.builtin.set_fact:
        default_domains: "{{ default_domains | default([]) + [item.name] }}"
      vars:
        ipspace_name: "{{ (item.ipspace | default({})).name | default('') }}"
        member_keys: >-
          {{
            item.ports | default([])
            | map(attribute='node.name')
            | zip(item.ports | default([]) | map(attribute='name'))
            | map('join', '/')
            | list
          }}
        blocked: "{{ member_keys | intersect(protected_ports | default([])) }}"
      when:
        - ipspace_name == 'Default'
        - item.name is match('^Default-')
        - blocked | length == 0
      loop: "{{ domain_info.ontap_info.network_ethernet_broadcast_domains.records | default([]) }}"
      loop_control:
        label: "{{ item.name | default('unnamed domain') }}"

    - name: Note when no autogenerated Default broadcast domain needs to be deleted
      ansible.builtin.debug:
        msg: >-
          No autogenerated Default broadcast domain was found without a cluster
          or node-management port, so nothing was deleted.
      when: default_domains | default([]) | length == 0

    - name: Delete the autogenerated Default broadcast domains
      netapp.ontap.na_ontap_broadcast_domain:
        state: absent
        name: "{{ item }}"
        ipspace: Default
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: "{{ default_domains | default([]) | unique }}"
      loop_control:
        label: "{{ item }}"
