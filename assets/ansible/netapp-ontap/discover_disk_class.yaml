---
- name: Discover the ONTAP disk class
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Get the disk class information
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ vars['ONTAP Cluster Management IP'] }}"
        username: "{{ vars['ONTAP Username'] }}"
        password: "{{ vars['ONTAP Password'] }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - storage/disks
        fields:
          - class
      register: disk_info
      no_log: true

    - name: Validate the discovered disk class
      ansible.builtin.assert:
        that:
          - disk_info.ontap_info.storage_disks.records | default([]) | length > 0
          - disk_info.ontap_info.storage_disks.records[0].class is defined
        fail_msg: No usable disk class was returned by the ONTAP cluster.

    - name: Print the disk class
      ansible.builtin.debug:
        msg: "{{ disk_info.ontap_info.storage_disks.records[0].class }}"

    - name: Export the disk class
      torque.collections.export_torque_outputs:
        outputs:
          disk_class: "{{ disk_info.ontap_info.storage_disks.records[0].class }}"
