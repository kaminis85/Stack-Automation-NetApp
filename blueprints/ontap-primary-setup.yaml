spec_version: 2
description: >-
  ONTAP primary setup from the FlexPod Base IMM role ontap_primary_setup.
  One blueprint. Each task has a run/skip choice and defaults to skip.
  Fibre Channel is not included.

instructions:
  source:
    store: Stack-Automation-NetApp
    path: instructions/ontap-primary-setup.md

metadata:
  display-name: ONTAP Primary Setup
  blueprint-labels:
    - key: Category
      value: Storage
  icon:
    path: graphics/netapp.svg

customization:
  grains-map:
    initial-map-view: custom
    nodes:
      update_cluster_location:
        type: grain
        position: {x: 80, y: 80}
      configure_cluster_mgmt:
        type: grain
        position: {x: 360, y: 80}
      delete_broadcast_domains:
        type: grain
        position: {x: 640, y: 80}
      configure_sp_network:
        type: grain
        position: {x: 920, y: 80}
      discover_disk_class:
        type: grain
        position: {x: 1200, y: 80}
      create_data_aggregates:
        type: grain
        position: {x: 80, y: 320}
      zero_spare_disks:
        type: grain
        position: {x: 360, y: 320}
      ensure_cluster_ha:
        type: grain
        position: {x: 640, y: 320}
      disable_flow_control:
        type: grain
        position: {x: 920, y: 320}
      enable_cdp:
        type: grain
        position: {x: 1200, y: 320}
      enable_lldp:
        type: grain
        position: {x: 80, y: 560}
      configure_dns:
        type: grain
        position: {x: 360, y: 560}
      configure_ntp:
        type: grain
        position: {x: 640, y: 560}
      enable_storage_failover:
        type: grain
        position: {x: 920, y: 560}
      set_timezone:
        type: grain
        position: {x: 1200, y: 560}
      configure_autosupport:
        type: grain
        position: {x: 360, y: 800}
      add_licenses:
        type: grain
        position: {x: 640, y: 800}
      configure_fips:
        type: grain
        position: {x: 920, y: 800}
      configure_snmp:
        type: grain
        position: {x: 1200, y: 800}
      create_login_banner:
        type: grain
        position: {x: 80, y: 1040}
  launch-form:
    categories:
      - name: Connection
        icon: layer
        sections:
          - name: CLUSTER
            icon: list
            default_open: true
            inputs:
              - name: agent
              - name: ontap_hostname
              - name: ontap_username
              - name: ontap_password
      - name: Cluster identity
        icon: list
        sections:
          - name: LOCATION
            default_open: true
            inputs:
              - name: cluster_location_action
              - name: cluster_name
                visible: '{% if inputs.cluster_location_action == "run" %}true{% else %}false{% endif %}'
              - name: cluster_location
                visible: '{% if inputs.cluster_location_action == "run" %}true{% else %}false{% endif %}'
          - name: TIMEZONE AND BANNER
            inputs:
              - name: timezone_action
              - name: time_zone
                visible: '{% if inputs.timezone_action == "run" %}true{% else %}false{% endif %}'
              - name: login_banner_action
              - name: cluster_login_banner
                visible: '{% if inputs.login_banner_action == "run" %}true{% else %}false{% endif %}'
      - name: High availability
        icon: layer
        sections:
          - name: MANAGEMENT AND FAILOVER
            inputs:
              - name: cluster_mgmt_action
              - name: cluster_mgmt_interface
                visible: '{% if inputs.cluster_mgmt_action == "run" %}true{% else %}false{% endif %}'
              - name: cluster_mgmt_auto_revert
                visible: '{% if inputs.cluster_mgmt_action == "run" %}true{% else %}false{% endif %}'
              - name: cluster_ha_action
              - name: ha_pair_count
                visible: '{% if inputs.cluster_ha_action == "run" %}true{% else %}false{% endif %}'
              - name: storage_failover
              - name: node_names
                visible: '{% if inputs.storage_failover == "run" or inputs.autosupport_action == "run" %}true{% else %}false{% endif %}'
      - name: Ports
        icon: tags
        sections:
          - name: BROADCAST DOMAINS AND SERVICE PROCESSOR
            inputs:
              - name: broadcast_domains_action
              - name: node_port_counts
                visible: '{% if inputs.broadcast_domains_action == "run" %}true{% else %}false{% endif %}'
              - name: sp_network_action
              - name: sp_interfaces
                type: object
                header: Node Name,SP IP,Netmask,Gateway
                visible: '{% if inputs.sp_network_action == "run" %}true{% else %}false{% endif %}'
          - name: DATA PORTS
            inputs:
              - name: flow_control_action
              - name: data_ports
                type: object
                header: Node Name,Data Ports
                visible: '{% if inputs.flow_control_action == "run" %}true{% else %}false{% endif %}'
              - name: cdp
              - name: lldp
      - name: Data aggregates
        icon: tags
        sections:
          - name: AGGREGATES
            default_open: true
            inputs:
              - name: aggregates_action
              - name: aggregates
                type: object
                header: Node Name,Aggregate Name,Disk Count
                visible: '{% if inputs.aggregates_action == "run" %}true{% else %}false{% endif %}'
              - name: zero_spares
      - name: Name services
        icon: list
        sections:
          - name: DNS AND NTP
            inputs:
              - name: dns_action
              - name: dns_domain_name
                visible: '{% if inputs.dns_action == "run" %}true{% else %}false{% endif %}'
              - name: dns_servers
                visible: '{% if inputs.dns_action == "run" %}true{% else %}false{% endif %}'
              - name: ntp_action
              - name: ntp_servers
                visible: '{% if inputs.ntp_action == "run" %}true{% else %}false{% endif %}'
      - name: Support and licenses
        icon: email
        sections:
          - name: AUTOSUPPORT
            inputs:
              - name: autosupport_action
              - name: autosupport_mail_hosts
                visible: '{% if inputs.autosupport_action == "run" %}true{% else %}false{% endif %}'
              - name: autosupport_from_address
                visible: '{% if inputs.autosupport_action == "run" %}true{% else %}false{% endif %}'
              - name: autosupport_to_addresses
                visible: '{% if inputs.autosupport_action == "run" %}true{% else %}false{% endif %}'
              - name: autosupport_proxy_url
                visible: '{% if inputs.autosupport_action == "run" %}true{% else %}false{% endif %}'
          - name: LICENSES
            inputs:
              - name: license_key_format
              - name: legacy_license_keys
                visible: '{% if inputs.license_key_format == "legacy" %}true{% else %}false{% endif %}'
              - name: nlf_license_content
                visible: '{% if inputs.license_key_format == "NLF" %}true{% else %}false{% endif %}'
      - name: Security
        icon: list
        sections:
          - name: FIPS AND SNMP
            inputs:
              - name: is_fips_enabled
              - name: snmp_action
              - name: snmp_contact
                visible: '{% if inputs.snmp_action == "run" %}true{% else %}false{% endif %}'
              - name: snmp_location
                visible: '{% if inputs.snmp_action == "run" %}true{% else %}false{% endif %}'
              - name: traphost_ip
                visible: '{% if inputs.snmp_action == "run" %}true{% else %}false{% endif %}'
              - name: snmp_community
                visible: '{% if inputs.snmp_action == "run" %}true{% else %}false{% endif %}'
              - name: snmp_v3_user
                visible: '{% if inputs.snmp_action == "run" %}true{% else %}false{% endif %}'
              - name: snmp_auth_protocol
                visible: '{% if inputs.snmp_action == "run" %}true{% else %}false{% endif %}'
              - name: snmp_auth_password
                visible: '{% if inputs.snmp_action == "run" %}true{% else %}false{% endif %}'
              - name: snmp_priv_protocol
                visible: '{% if inputs.snmp_action == "run" %}true{% else %}false{% endif %}'
              - name: snmp_priv_password
                visible: '{% if inputs.snmp_action == "run" %}true{% else %}false{% endif %}'

inputs:
  agent:
    type: agent
    description: Select an agent that can reach the ONTAP cluster.
  ontap_hostname:
    type: string
    description: ONTAP cluster management IP address or hostname.
  ontap_username:
    type: string
    description: ONTAP cluster administrator username.
  ontap_password:
    type: string
    sensitive: true
    description: ONTAP cluster administrator password.
  cluster_location_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Set the cluster name and location only when this is run.
  cluster_mgmt_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Configure the cluster management interface only when this is run.
  broadcast_domains_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Delete default broadcast domains only when this is run.
  sp_network_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Configure service-processor addresses only when this is run.
  aggregates_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Discover the disk class and create aggregates only when this is run.
  cluster_ha_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Enable cluster HA only when this is run. ha_pair_count must be 1.
  flow_control_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Disable flow control on the listed data ports only when this is run.
  dns_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Configure DNS only when this is run.
  ntp_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Configure NTP only when this is run.
  timezone_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Set the cluster timezone only when this is run.
  autosupport_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Configure AutoSupport only when this is run.
  snmp_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Configure SNMP only when this is run.
  login_banner_action:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Set the login banner only when this is run.
  cluster_name:
    type: string
    default: ""
    description: ONTAP cluster name. Used by location and timezone.
  cluster_location:
    type: string
    default: ""
    description: Location string stored on the cluster.
  cluster_mgmt_interface:
    type: string
    default: ""
    description: Cluster management interface name. Leave empty to skip this task.
  cluster_mgmt_auto_revert:
    type: string
    default: "true"
    allowed-values: ["true", "false"]
    description: Enable auto-revert on the cluster management interface.
  node_port_counts:
    type: string
    default: ""
    description: >-
      Comma-separated data-port count per node, for example 2,2. The role
      deletes (sum of these counts) times 2 default broadcast domains.
  sp_interfaces:
    type: string
    default: "[]"
    description: One row per node with the service-processor IP, netmask, and gateway.
  aggregates:
    type: string
    default: "[]"
    description: >-
      Leave empty to skip aggregate creation. Otherwise one row per aggregate,
      naming the node, the aggregate, and how many disks it uses.
  zero_spares:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Zero spare disks only when this is run.
  ha_pair_count:
    type: string
    default: ""
    description: Set to 1 to enable cluster HA on a two-node cluster. Leave empty to skip.
  data_ports:
    type: string
    default: "[]"
    description: >-
      One row per node. Data Ports is a comma-separated port list, for example
      e0e,e0f. Leave empty to skip flow-control changes.
  cdp:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Enable CDP only when this is run.
  lldp:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Enable LLDP only when this is run.
  dns_domain_name:
    type: string
    default: ""
    description: DNS domain name.
  dns_servers:
    type: string
    default: ""
    description: Comma-separated DNS server IP addresses.
  ntp_servers:
    type: string
    default: ""
    description: Comma-separated NTP server IP addresses.
  storage_failover:
    type: string
    default: skip
    allowed-values: ["skip", "run"]
    description: Enable storage-failover takeover only when this is run.
  node_names:
    type: string
    default: ""
    description: >-
      Comma-separated ONTAP node names. Used by storage failover and AutoSupport.
  time_zone:
    type: string
    default: ""
    description: ONTAP timezone name, for example America/Los_Angeles.
  autosupport_mail_hosts:
    type: string
    default: ""
    description: Comma-separated AutoSupport mail hosts.
  autosupport_from_address:
    type: string
    default: ""
    description: AutoSupport From address.
  autosupport_to_addresses:
    type: string
    default: ""
    description: Comma-separated AutoSupport recipient addresses.
  autosupport_proxy_url:
    type: string
    default: ""
    description: Optional AutoSupport proxy URL. Leave empty to omit it.
  license_key_format:
    type: string
    default: skip
    allowed-values: ["skip", "legacy", "NLF"]
    description: skip leaves licenses unchanged. legacy uses keys. NLF uses pasted license-file contents.
  legacy_license_keys:
    type: string
    sensitive: true
    default: ""
    description: Comma-separated legacy license keys.
  nlf_license_content:
    type: string
    sensitive: true
    default: ""
    description: Full contents of the NetApp license file.
  is_fips_enabled:
    type: string
    default: skip
    allowed-values: ["skip", "true", "false"]
    description: skip leaves FIPS unchanged. true or false sets SSL FIPS mode. When true, SNMP community and traphost are not configured.
  snmp_contact:
    type: string
    default: ""
    description: SNMP contact string.
  snmp_location:
    type: string
    default: ""
    description: SNMP location string.
  traphost_ip:
    type: string
    default: ""
    description: SNMP trap host. Applied only when FIPS is disabled.
  snmp_community:
    type: string
    sensitive: true
    default: ""
    description: SNMPv1/v2c community. Applied only when FIPS is disabled.
  snmp_v3_user:
    type: string
    default: ""
    description: SNMPv3 user name.
  snmp_auth_protocol:
    type: string
    default: sha
    description: SNMPv3 authentication protocol.
  snmp_auth_password:
    type: string
    sensitive: true
    default: ""
    description: SNMPv3 authentication password.
  snmp_priv_protocol:
    type: string
    default: aes128
    description: SNMPv3 privacy protocol.
  snmp_priv_password:
    type: string
    sensitive: true
    default: ""
    description: SNMPv3 privacy password.
  cluster_login_banner:
    type: string
    default: ""
    description: Login banner text.

grains:
  update_cluster_location:
    kind: ansible
    when: '{% if .inputs.cluster_location_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/update_cluster_location.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - cluster_name: '{{ .inputs.cluster_name }}'
        - cluster_location: '{{ .inputs.cluster_location }}'

  configure_cluster_mgmt:
    kind: ansible
    when: '{% if .inputs.cluster_mgmt_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_cluster_mgmt.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - cluster_mgmt_interface: '{{ .inputs.cluster_mgmt_interface }}'
        - cluster_mgmt_auto_revert: '{{ .inputs.cluster_mgmt_auto_revert }}'

  delete_broadcast_domains:
    kind: ansible
    when: '{% if .inputs.broadcast_domains_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/delete_broadcast_domains.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - node_port_counts: '{{ .inputs.node_port_counts }}'

  configure_sp_network:
    kind: ansible
    when: '{% if .inputs.sp_network_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_sp_network.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - sp_interfaces: '{{ .inputs.sp_interfaces }}'

  discover_disk_class:
    kind: ansible
    when: '{% if .inputs.aggregates_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/discover_disk_class.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
      outputs:
        - disk_class

  create_data_aggregates:
    kind: ansible
    when: '{% if .inputs.aggregates_action == "run" %}true{% else %}false{% endif %}'
    depends-on: discover_disk_class
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/create_data_aggregates.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - aggregates: '{{ .inputs.aggregates }}'
        - disk_class: '{{ .grains.discover_disk_class.outputs.disk_class }}'
      outputs:
        - aggregate_status

  zero_spare_disks:
    kind: ansible
    when: '{% if .inputs.zero_spares == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/zero_spare_disks.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - zero_spares: '{{ .inputs.zero_spares }}'

  ensure_cluster_ha:
    kind: ansible
    when: '{% if .inputs.cluster_ha_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/ensure_cluster_ha.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - ha_pair_count: '{{ .inputs.ha_pair_count }}'

  disable_flow_control:
    kind: ansible
    when: '{% if .inputs.flow_control_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/disable_flow_control.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - data_ports: '{{ .inputs.data_ports }}'

  enable_cdp:
    kind: ansible
    when: '{% if .inputs.cdp == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/enable_cdp.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - cdp: '{{ .inputs.cdp }}'

  enable_lldp:
    kind: ansible
    when: '{% if .inputs.lldp == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/enable_lldp.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - lldp: '{{ .inputs.lldp }}'

  configure_dns:
    kind: ansible
    when: '{% if .inputs.dns_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_dns.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - dns_servers: '{{ .inputs.dns_servers }}'
        - dns_domain_name: '{{ .inputs.dns_domain_name }}'

  configure_ntp:
    kind: ansible
    when: '{% if .inputs.ntp_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_ntp.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - ntp_servers: '{{ .inputs.ntp_servers }}'

  enable_storage_failover:
    kind: ansible
    when: '{% if .inputs.storage_failover == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/enable_storage_failover.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - storage_failover: '{{ .inputs.storage_failover }}'
        - node_names: '{{ .inputs.node_names }}'

  set_timezone:
    kind: ansible
    when: '{% if .inputs.timezone_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/set_timezone.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - cluster_name: '{{ .inputs.cluster_name }}'
        - time_zone: '{{ .inputs.time_zone }}'


  configure_autosupport:
    kind: ansible
    when: '{% if .inputs.autosupport_action == "run" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_autosupport.yaml
      agent:
