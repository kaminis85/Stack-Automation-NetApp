spec_version: 2
description: >-
  ONTAP primary setup from the FlexPod Base IMM role ontap_primary_setup.
  Only the cluster address, username, and password are required. A task runs
  when its fields are filled in and stays skipped when they are left blank.
  Fibre Channel is not included.

instructions:
  source:
    store: Stack-Automation-NetApp
    path: instructions/ontap-primary-setup.md

metadata:
  display-name: ONTAP Primary Setup
  blueprint-labels:
    - key: Category
      value: Storage
  icon:
    path: graphics/netapp.svg

customization:
  grains-map:
    initial-map-view: custom
    nodes:
      update_cluster_location:
        type: grain
        position: {x: 80, y: 80}
      configure_cluster_mgmt:
        type: grain
        position: {x: 360, y: 80}
      delete_broadcast_domains:
        type: grain
        position: {x: 640, y: 80}
      configure_sp_network:
        type: grain
        position: {x: 920, y: 80}
      discover_disk_class:
        type: grain
        position: {x: 1200, y: 80}
      create_data_aggregates:
        type: grain
        position: {x: 80, y: 320}
      zero_spare_disks:
        type: grain
        position: {x: 360, y: 320}
      ensure_cluster_ha:
        type: grain
        position: {x: 640, y: 320}
      disable_flow_control:
        type: grain
        position: {x: 920, y: 320}
      enable_cdp:
        type: grain
        position: {x: 1200, y: 320}
      enable_lldp:
        type: grain
        position: {x: 80, y: 560}
      configure_dns:
        type: grain
        position: {x: 360, y: 560}
      configure_ntp:
        type: grain
        position: {x: 640, y: 560}
      enable_storage_failover:
        type: grain
        position: {x: 920, y: 560}
      set_timezone:
        type: grain
        position: {x: 1200, y: 560}
      configure_autosupport:
        type: grain
        position: {x: 360, y: 800}
      add_licenses:
        type: grain
        position: {x: 640, y: 800}
      configure_fips:
        type: grain
        position: {x: 920, y: 800}
      configure_snmp:
        type: grain
        position: {x: 1200, y: 800}
      create_login_banner:
        type: grain
        position: {x: 80, y: 800}
  launch-form:
    categories:
      - name: ONTAP Configuration Parameters
        icon: layer
        sections:
          - name: Infrastructure
            icon: list
            inputs:
              - name: agent
          - name: Cluster Details
            inputs:
              - name: ontap_hostname
              - name: ontap_username
              - name: ontap_password
              - name: cluster_name
              - name: cluster_location
              - name: cluster_mgmt_interface
              - name: cluster_mgmt_auto_revert
              - name: ha_pair_count
              - name: node_names
              - name: time_zone
              - name: cluster_login_banner
          - name: Cluster Port parameters
            inputs:
              - name: node_port_counts
              - name: sp_interfaces
                type: object
                header: Node Name,SP IP,Netmask,Gateway
              - name: data_ports
                type: object
                header: Node Name,Data Ports
          - name: Data aggregates
            inputs:
              - name: aggregates
                type: object
                header: Node Name,Aggregate Name,Disk Count
          - name: DNS and NTP
            inputs:
              - name: dns_domain_name
              - name: dns_servers
              - name: ntp_servers
          - name: AutoSupport Parameters
            inputs:
              - name: autosupport_mail_hosts
              - name: autosupport_from_address
              - name: autosupport_to_addresses
              - name: autosupport_proxy_url
          - name: ONTAP Licenses
            inputs:
              - name: legacy_license_keys
              - name: nlf_license_content
          - name: FIPS and SNMP Configuration Parameters
            inputs:
              - name: is_fips_enabled
              - name: snmp_contact
              - name: snmp_location
              - name: traphost_ip
              - name: snmp_community
              - name: snmp_v3_user
              - name: snmp_auth_protocol
              - name: snmp_auth_password
              - name: snmp_priv_protocol
              - name: snmp_priv_password

inputs:
  agent:
    type: agent
    description: Select an agent that can reach the ONTAP cluster.
  ontap_hostname:
    type: string
    description: ONTAP cluster management IP address or hostname.
  ontap_username:
    type: string
    default: admin
    description: ONTAP cluster administrator username.
  ontap_password:
    type: string
    sensitive: true
    description: ONTAP cluster administrator password.
  cluster_name:
    type: string
    default: ""
    description: ONTAP cluster name. Used by location and timezone.
  cluster_location:
    type: string
    default: ""
    description: Location string stored on the cluster.
  cluster_mgmt_interface:
    type: string
    default: ""
    description: Cluster management interface name. Leave empty to skip this task.
  cluster_mgmt_auto_revert:
    type: string
    default: "true"
    allowed-values: ["true", "false"]
    description: Enable auto-revert on the cluster management interface.
  node_port_counts:
    type: string
    default: ""
    description: >-
      Comma-separated data-port count per node, for example 2,2. The role
      deletes (sum of these counts) times 2 default broadcast domains.
  sp_interfaces:
    type: string
    default: "[]"
    description: >-
      One row per node with Node Name, service-processor IP, Netmask, and Gateway.
      Leave the table empty to skip.
  aggregates:
    type: string
    default: "[]"
    description: >-
      One row per aggregate with Node Name, Aggregate Name, and Disk Count.
      Leave the table empty to skip.
  ha_pair_count:
    type: string
    default: ""
    description: Set to 1 to enable cluster HA on a two-node cluster. Leave empty to skip.
  data_ports:
    type: string
    default: "[]"
    description: >-
      One row per node. Data Ports is a comma-separated list, for example
      e0e,e0f. Leave the table empty to skip.
  dns_domain_name:
    type: string
    default: ""
    description: DNS domain name.
  dns_servers:
    type: string
    default: ""
    description: Comma-separated DNS server IP addresses.
  ntp_servers:
    type: string
    default: ""
    description: Comma-separated NTP server IP addresses.
  node_names:
    type: string
    default: ""
    description: >-
      Comma-separated ONTAP node names. Used by storage failover and AutoSupport.
  time_zone:
    type: string
    default: ""
    description: ONTAP timezone name, for example America/Los_Angeles.
  autosupport_mail_hosts:
    type: string
    default: ""
    description: Comma-separated AutoSupport mail hosts.
  autosupport_from_address:
    type: string
    default: ""
    description: AutoSupport From address.
  autosupport_to_addresses:
    type: string
    default: ""
    description: Comma-separated AutoSupport recipient addresses.
  autosupport_proxy_url:
    type: string
    default: ""
    description: Optional AutoSupport proxy URL. Leave empty to omit it.
  legacy_license_keys:
    type: string
    sensitive: true
    default: ""
    description: Comma-separated legacy license keys.
  nlf_license_content:
    type: string
    sensitive: true
    default: ""
    description: Full contents of the NetApp license file.
  is_fips_enabled:
    type: string
    default: ""
    description: Leave blank to skip. Enter true or false to set SSL FIPS mode.
  snmp_contact:
    type: string
    default: ""
    description: SNMP contact string.
  snmp_location:
    type: string
    default: ""
    description: SNMP location string.
  traphost_ip:
    type: string
    default: ""
    description: SNMP trap host. Applied only when FIPS is disabled.
  snmp_community:
    type: string
    sensitive: true
    default: ""
    description: SNMPv1/v2c community. Applied only when FIPS is disabled.
  snmp_v3_user:
    type: string
    default: ""
    description: SNMPv3 user name.
  snmp_auth_protocol:
    type: string
    default: sha
    description: SNMPv3 authentication protocol.
  snmp_auth_password:
    type: string
    sensitive: true
    default: ""
    description: SNMPv3 authentication password.
  snmp_priv_protocol:
    type: string
    default: aes128
    description: SNMPv3 privacy protocol.
  snmp_priv_password:
    type: string
    sensitive: true
    default: ""
    description: SNMPv3 privacy password.
  cluster_login_banner:
    type: string
    default: ""
    description: Login banner text.

grains:
  update_cluster_location:
    kind: ansible
    when: '{% if .inputs.cluster_name != "" and .inputs.cluster_location != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/update_cluster_location.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - cluster_name: '{{ .inputs.cluster_name }}'
        - cluster_location: '{{ .inputs.cluster_location }}'

  configure_cluster_mgmt:
    kind: ansible
    when: '{% if .inputs.cluster_mgmt_interface != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_cluster_mgmt.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - cluster_mgmt_interface: '{{ .inputs.cluster_mgmt_interface }}'
        - cluster_mgmt_auto_revert: '{{ .inputs.cluster_mgmt_auto_revert }}'

  delete_broadcast_domains:
    kind: ansible
    when: '{% if .inputs.node_port_counts != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/delete_broadcast_domains.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - node_port_counts: '{{ .inputs.node_port_counts }}'

  configure_sp_network:
    kind: ansible
    when: '{% if .inputs.sp_interfaces != "" and .inputs.sp_interfaces != "[]" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_sp_network.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - sp_interfaces: '{{ .inputs.sp_interfaces }}'

  discover_disk_class:
    kind: ansible
    when: '{% if .inputs.aggregates != "" and .inputs.aggregates != "[]" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/discover_disk_class.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
      outputs:
        - disk_class

  create_data_aggregates:
    kind: ansible
    when: '{% if .inputs.aggregates != "" and .inputs.aggregates != "[]" %}true{% else %}false{% endif %}'
    depends-on: discover_disk_class
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/create_data_aggregates.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - aggregates: '{{ .inputs.aggregates }}'
        - disk_class: '{{ .grains.discover_disk_class.outputs.disk_class }}'
      outputs:
        - aggregate_status

  zero_spare_disks:
    kind: ansible
    when: '{% if false %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/zero_spare_disks.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'

  ensure_cluster_ha:
    kind: ansible
    when: '{% if .inputs.ha_pair_count == "1" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/ensure_cluster_ha.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - ha_pair_count: '{{ .inputs.ha_pair_count }}'

  disable_flow_control:
    kind: ansible
    when: '{% if .inputs.data_ports != "" and .inputs.data_ports != "[]" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/disable_flow_control.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - data_ports: '{{ .inputs.data_ports }}'

  enable_cdp:
    kind: ansible
    when: '{% if false %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/enable_cdp.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'

  enable_lldp:
    kind: ansible
    when: '{% if false %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/enable_lldp.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'

  configure_dns:
    kind: ansible
    when: '{% if .inputs.dns_domain_name != "" and .inputs.dns_servers != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_dns.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - dns_servers: '{{ .inputs.dns_servers }}'
        - dns_domain_name: '{{ .inputs.dns_domain_name }}'

  configure_ntp:
    kind: ansible
    when: '{% if .inputs.ntp_servers != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_ntp.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - ntp_servers: '{{ .inputs.ntp_servers }}'

  enable_storage_failover:
    kind: ansible
    when: '{% if .inputs.node_names != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/enable_storage_failover.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - node_names: '{{ .inputs.node_names }}'

  set_timezone:
    kind: ansible
    when: '{% if .inputs.cluster_name != "" and .inputs.time_zone != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/set_timezone.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - cluster_name: '{{ .inputs.cluster_name }}'
        - time_zone: '{{ .inputs.time_zone }}'


  configure_autosupport:
    kind: ansible
    when: '{% if .inputs.node_names != "" and .inputs.autosupport_mail_hosts != "" and .inputs.autosupport_from_address != "" and .inputs.autosupport_to_addresses != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_autosupport.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - node_names: '{{ .inputs.node_names }}'
        - autosupport_mail_hosts: '{{ .inputs.autosupport_mail_hosts }}'
        - autosupport_from_address: '{{ .inputs.autosupport_from_address }}'
        - autosupport_to_addresses: '{{ .inputs.autosupport_to_addresses }}'
        - autosupport_proxy_url: '{{ .inputs.autosupport_proxy_url }}'

  add_licenses:
    kind: ansible
    when: '{% if .inputs.legacy_license_keys != "" or .inputs.nlf_license_content != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/add_licenses.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - legacy_license_keys: '{{ .inputs.legacy_license_keys }}'
        - nlf_license_content: '{{ .inputs.nlf_license_content }}'

  configure_fips:
    kind: ansible
    when: '{% if .inputs.is_fips_enabled == "true" or .inputs.is_fips_enabled == "false" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_fips.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - is_fips_enabled: '{{ .inputs.is_fips_enabled }}'

  configure_snmp:
    kind: ansible
    when: '{% if .inputs.snmp_contact != "" or .inputs.snmp_location != "" or .inputs.snmp_v3_user != "" or .inputs.snmp_community != "" or .inputs.traphost_ip != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/configure_snmp.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - is_fips_enabled: '{{ .inputs.is_fips_enabled }}'
        - snmp_contact: '{{ .inputs.snmp_contact }}'
        - snmp_location: '{{ .inputs.snmp_location }}'
        - traphost_ip: '{{ .inputs.traphost_ip }}'
        - snmp_community: '{{ .inputs.snmp_community }}'
        - snmp_v3_user: '{{ .inputs.snmp_v3_user }}'
        - snmp_auth_protocol: '{{ .inputs.snmp_auth_protocol }}'
        - snmp_auth_password: '{{ .inputs.snmp_auth_password }}'
        - snmp_priv_protocol: '{{ .inputs.snmp_priv_protocol }}'
        - snmp_priv_password: '{{ .inputs.snmp_priv_password }}'

  create_login_banner:
    kind: ansible
    when: '{% if .inputs.cluster_login_banner != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/create_login_banner.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        - cluster_login_banner: '{{ .inputs.cluster_login_banner }}'
