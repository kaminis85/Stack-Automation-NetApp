---
- name: Enable ONTAP storage-failover takeover
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Discover ONTAP cluster nodes
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - cluster/nodes
        fields:
          - name
      register: node_info
      no_log: true

    - name: Build the node list
      ansible.builtin.set_fact:
        node_list: >-
          {{
            node_info.ontap_info.cluster_nodes.records
            | default([])
            | map(attribute='name')
            | list
          }}

    - name: Validate discovered nodes
      ansible.builtin.assert:
        that:
          - node_list | length > 0
        fail_msg: The cluster did not return any node names.

    - name: Enable takeover for storage failover
      netapp.ontap.na_ontap_rest_cli:
        command: "storage/failover/objects/{{ item }}"
        verb: PATCH
        body:
          enabled: "true"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      loop: "{{ node_list }}"
