spec_version: 2
description: >-
  Composite NetApp demo that chains reusable sub-blueprints. It currently runs
  the ONTAP data aggregate sub-blueprint, and is the place to add Nexus, UCS,
  and MDS sub-blueprints as they are built.

instructions:
  source:
    store: Stack-Automation-NetApp
    path: instructions/netapp-sa-demo.md

metadata:
  display-name: NetApp SA Demo (Composite)
  blueprint-labels:
    - key: Category
      value: Storage
    - key: Experimental
  icon:
    path: graphics/netapp-sa-demo.svg

customization:
  launch-form:
    categories:
      - name: ONTAP Cluster
        icon: layer
        sections:
          - name: CONNECTION
            icon: list
            default_open: true
            inputs:
              - name: agent
              - name: ONTAP Cluster Management IP
              - name: ONTAP Username
              - name: ONTAP Password
          - name: DATA AGGREGATES
            icon: tags
            default_open: true
            inputs:
              - name: Aggregate Inputs
                type: object
                header: Node Name,Aggregate Name,Disk Count

inputs:
  agent:
    type: agent
    description: Select an agent that can reach the ONTAP cluster.
  ONTAP Cluster Management IP:
    type: string
    description: ONTAP cluster management IP address or hostname.
  ONTAP Username:
    type: string
    default: admin
    description: ONTAP cluster administrator username.
  ONTAP Password:
    type: string
    sensitive: true
    description: ONTAP cluster administrator password.
  Aggregate Inputs:
    type: string
    default: |
      [
        {"node_name": "AA02-C800-01", "aggregate_name": "AA02_C800_01_SSD_CAP_1", "disk_count": 15},
        {"node_name": "AA02-C800-02", "aggregate_name": "AA02_C800_02_SSD_CAP_1", "disk_count": 15}
      ]
    description: >-
      One row per aggregate, naming the node it is created on, the aggregate
      name, and how many disks it uses.

outputs:
  aggregate_status:
    value: '{{ .grains.ontap.outputs.aggregate_status }}'

grains:
  ontap:
    kind: blueprint
    spec:
      source:
        store: Stack-Automation-NetApp
        path: blueprints/sub-blueprints/netapp-ontap.yaml
      inputs:
        - agent: '{{ .inputs.agent }}'
        - ONTAP Cluster Management IP: '{{ .inputs.ONTAP Cluster Management IP }}'
        - ONTAP Username: '{{ .inputs.ONTAP Username }}'
        - ONTAP Password: '{{ .inputs.ONTAP Password }}'
        - Aggregate Inputs: '{{ .inputs.Aggregate Inputs }}'
      outputs:
        - aggregate_status
