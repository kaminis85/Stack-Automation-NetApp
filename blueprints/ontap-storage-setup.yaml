spec_version: 2
description: >-
  Set up an ONTAP cluster and an optional SVM. Only the cluster address,
  username, and password are required. Fill in a section to run that task,
  or leave it blank to skip it. SSL FIPS is set on every launch and defaults
  to false. Fibre Channel, NVMe, and S3 are not included. Open the
  instructions for which fields start or skip each task.

instructions:
  source:
    store: Stack-Automation-NetApp
    path: instructions/ontap-storage-setup.md

metadata:
  display-name: ONTAP Storage Setup
  blueprint-labels:
    - key: Category
      value: Storage
  icon:
    path: graphics/netapp.svg

customization:
  grains-map:
    initial-map-view: custom
    nodes:
      pre_validation:
        type: grain
        position: {x: 80, y: 80}
      update_cluster_location:
        type: grain
        position: {x: 360, y: 80}
      ensure_cluster_mgmt_auto_revert:
        type: grain
        position: {x: 640, y: 80}
      delete_default_broadcast_domains:
        type: grain
        position: {x: 920, y: 80}
      configure_sp_network:
        type: grain
        position: {x: 1200, y: 80}
      discover_disk_class:
        type: grain
        position: {x: 80, y: 320}
      create_data_aggregates:
        type: grain
        position: {x: 360, y: 320}
      zero_spare_disks:
        type: grain
        position: {x: 640, y: 320}
      ensure_cluster_ha:
        type: grain
        position: {x: 920, y: 320}
      disable_flow_control:
        type: grain
        position: {x: 1200, y: 320}
      enable_cdp:
        type: grain
        position: {x: 80, y: 560}
      enable_lldp:
        type: grain
        position: {x: 360, y: 560}
      configure_dns:
        type: grain
        position: {x: 640, y: 560}
      configure_ntp:
        type: grain
        position: {x: 920, y: 560}
      enable_storage_failover:
        type: grain
        position: {x: 1200, y: 560}
      set_timezone:
        type: grain
        position: {x: 80, y: 800}
      configure_autosupport:
        type: grain
        position: {x: 360, y: 800}
      add_licenses:
        type: grain
        position: {x: 640, y: 800}
      configure_fips:
        type: grain
        position: {x: 920, y: 800}
      configure_snmp:
        type: grain
        position: {x: 1200, y: 800}
      create_login_banner:
        type: grain
        position: {x: 80, y: 1040}
      disable_http_cluster_management:
        type: grain
        position: {x: 360, y: 1040}
      configure_ifgrp:
        type: grain
        position: {x: 640, y: 1040}
      configure_ipspace:
        type: grain
        position: {x: 920, y: 1040}
      configure_broadcast_domains:
        type: grain
        position: {x: 1200, y: 1040}
      configure_vlan_interfaces:
        type: grain
        position: {x: 80, y: 1280}
      configure_ontap_svm:
        type: grain
        position: {x: 360, y: 1280}
      configure_svm_load_sharing_snapmirror:
        type: grain
        position: {x: 640, y: 1280}
      configure_svm_vsadmin:
        type: grain
        position: {x: 920, y: 1280}
      configure_svm_login_banner:
        type: grain
        position: {x: 1200, y: 1280}
      configure_svm_mgmt_lif:
        type: grain
        position: {x: 80, y: 1520}
      configure_svm_default_route:
        type: grain
        position: {x: 360, y: 1520}
      configure_svm_dns:
        type: grain
        position: {x: 640, y: 1520}
      configure_nfs_export_policy:
        type: grain
        position: {x: 920, y: 1520}
      configure_svm_audit_log:
        type: grain
        position: {x: 1200, y: 1520}
      configure_nfs_lif:
        type: grain
        position: {x: 80, y: 1760}
      configure_iscsi_lif:
        type: grain
        position: {x: 360, y: 1760}
      post_config_validation:
        type: grain
        position: {x: 640, y: 1760}
  launch-form:
    categories:
      - name: ONTAP Storage Setup
        icon: layer
        sections:
          - name: Management Server
            icon: list
            inputs:
              - name: agent
          - name: Cluster Details
            inputs:
              - name: ontap_hostname
              - name: ontap_username
              - name: ontap_password
              - name: cluster_name
              - name: cluster_location
              - name: time_zone
              - name: cluster_login_banner
          - name: Node configuration. One row per node and one aggregate. Fill in NFS/iSCSI LIF details based on the protocol.Skip if not needed. To skip these tasks, delete every row. A blank row keeps Finish disabled.
            inputs:
              - name: node_specs
                type: object
                header: Node Name,SP IP,SP Netmask,SP Gateway,Data Ports,Aggregate Name,Disk Count,NFS LIF Name, NFS LIF Address, NFS LIF Netmask,iSCSI A LIF Name,iSCSI A LIF Address,iSCSI A LIF Netmask,iSCSI B LIF Name,iSCSI B LIF Address,iSCSI B LIF Netmask
          - name: DNS and NTP
            inputs:
              - name: dns_domain_name
              - name: dns_servers
              - name: ntp_servers
          - name: AutoSupport Parameters
            inputs:
              - name: autosupport_mail_hosts
              - name: autosupport_from_address
              - name: autosupport_to_addresses
              - name: autosupport_proxy_url
              - name: autosupport_message
          - name: ONTAP Licenses
            inputs:
              - name: legacy_license_keys
              - name: nlf_license_content
          - name: FIPS and SNMP Configuration Parameters
            inputs:
              - name: is_fips_enabled
              - name: snmp_contact
              - name: snmp_location
              - name: traphost_ip
                visible: '{% if inputs.is_fips_enabled != "true" %}true{% else %}false{% endif %}'
              - name: snmp_community
                visible: '{% if inputs.is_fips_enabled != "true" %}true{% else %}false{% endif %}'
              - name: snmp_v3_user
              - name: snmp_auth_protocol
                visible: '{% if inputs.is_fips_enabled != "true" %}true{% else %}false{% endif %}'
              - name: snmp_auth_protocol_fips
                visible: '{% if inputs.is_fips_enabled == "true" %}true{% else %}false{% endif %}'
              - name: snmp_auth_password
              - name: snmp_priv_protocol
                visible: '{% if inputs.is_fips_enabled != "true" %}true{% else %}false{% endif %}'
              - name: snmp_priv_protocol_fips
                visible: '{% if inputs.is_fips_enabled == "true" %}true{% else %}false{% endif %}'
              - name: snmp_priv_password
          - name: Network Configuration
            inputs:
              - name: ifgrp_name
              - name: ifgrp_mode
              - name: ipspace_name
              - name: ib_mgmt_vlan_name
              - name: ib_mgmt_vlan_id
              - name: nfs_vlan_name
              - name: nfs_vlan_id
              - name: iscsi_a_vlan_name
              - name: iscsi_a_vlan_id
              - name: iscsi_b_vlan_name
              - name: iscsi_b_vlan_id
          - name: SVM Configuration
            inputs:
              - name: svm_name
              - name: allowed_protocols
              - name: job_name
              - name: job_minutes
              - name: vsadmin_password
              - name: svm_login_banner
              - name: svm_mgmt_lif_name
              - name: svm_mgmt_lif_address
              - name: svm_mgmt_lif_netmask
              - name: svm_mgmt_lif_gateway
              - name: svm_dns_servers
              - name: svm_dns_domain
          - name: Volume Configuration
            inputs:
              - name: nfs_client_match
              - name: audit_log_volume_name
              - name: audit_log_volume_size_gb
              - name: audit_log_aggregate

inputs:
  agent:
    type: agent
    description: Select an agent that can reach the ONTAP cluster.
  ontap_hostname:
    type: string
    description: ONTAP cluster management IP address or hostname.
  ontap_username:
    type: string
    default: admin
    description: ONTAP cluster administrator username.
  ontap_password:
    type: string
    sensitive: true
    description: ONTAP cluster administrator password.
  cluster_name:
    type: string
    default: ""
    description: >-
      ONTAP cluster name. Used by location, timezone, and disabling HTTP
      cluster management. Must exactly match the cluster's current name.
      Entering a different value renames the cluster when location or timezone
      is set. Leave this blank to skip those tasks and leave HTTP management
      unchanged.
  cluster_location:
    type: string
    default: ""
    description: Location string stored on the cluster.
  node_specs:
    type: string
    default: "[]"
    description: >-
      One row per node. The node name is entered once and applies to that node's
      service processor, data ports, interface group, and one aggregate. Data
      Ports is a comma-separated list, for example e5a,e5b. In-band management,
      NFS, and iSCSI VLANs are created on the interface group of each node that
      lists data ports. Aggregate names from these rows are assigned to the SVM
      when an SVM name is set. To skip service-processor, aggregate, interface-group,
      and data-port tasks, delete every row. A blank row keeps Finish disabled.
  dns_domain_name:
    type: string
    default: ""
    description: DNS domain name.
  dns_servers:
    type: string
    default: ""
    description: Comma-separated DNS server IP addresses.
  ntp_servers:
    type: string
    default: ""
    description: Comma-separated NTP server IP addresses.
  time_zone:
    type: string
    default: ""
    description: ONTAP timezone name, for example America/Los_Angeles.
  autosupport_mail_hosts:
    type: string
    default: ""
    description: Comma-separated AutoSupport mail hosts.
  autosupport_from_address:
    type: string
    default: ""
    description: AutoSupport From address.
  autosupport_to_addresses:
    type: string
    default: ""
    description: Comma-separated AutoSupport recipient addresses.
  autosupport_proxy_url:
    type: string
    default: ""
    description: Optional AutoSupport proxy URL. Leave empty to omit it.
  autosupport_message:
    type: string
    default: "FlexPod ONTAP Storage Configuration completed"
    description: Text to be passed for the AutoSupport test.
  legacy_license_keys:
    type: string
    sensitive: true
    default: ""
    description: Comma-separated legacy license keys.
  nlf_license_content:
    type: string
    sensitive: true
    default: ""
    description: Full contents of the NetApp license file.
  is_fips_enabled:
    type: string
    default: "false"
    allowed-values: ["false", "true"]
    description: >-
      SSL FIPS mode. Defaults to false, which matches a new ONTAP cluster.
      Choose true to enable FIPS-compliant SSL. Every launch applies this value.
  snmp_contact:
    type: string
    default: ""
    description: Optional SNMP contact string. Leave empty to skip.
  snmp_location:
    type: string
    default: ""
    description: Optional SNMP location string. Leave empty to skip.
  traphost_ip:
    type: string
    default: ""
    description: Optional SNMP trap host. Leave empty to skip. Applied only when FIPS is not enabled.
  snmp_community:
    type: string
    default: ""
    description: Optional SNMPv1/v2c community name. Leave empty to skip. Applied only when FIPS is not enabled.
  snmp_v3_user:
    type: string
    default: ""
    description: Optional SNMPv3 user name. Leave empty to skip SNMPv3.
  snmp_auth_protocol:
    type: string
    default: none
    allowed-values: ["none", "md5", "sha", "sha2_256"]
    description: SNMPv3 authentication protocol when FIPS is off. A password is required unless this is none.
  snmp_auth_protocol_fips:
    type: string
    default: sha
    allowed-values: ["sha", "sha2_256"]
    description: SNMPv3 authentication protocol when FIPS is on. Only sha and sha2_256 are compliant.
  snmp_auth_password:
    type: string
    sensitive: true
    default: ""
    description: SNMPv3 authentication password.
  snmp_priv_protocol:
    type: string
    default: none
    allowed-values: ["none", "des", "aes128"]
    description: SNMPv3 privacy protocol when FIPS is off. A password is required unless this is none.
  snmp_priv_protocol_fips:
    type: string
    default: aes128
    allowed-values: ["aes128"]
    description: SNMPv3 privacy protocol when FIPS is on. aes128 is the only compliant value.
  snmp_priv_password:
    type: string
    sensitive: true
    default: ""
    description: SNMPv3 privacy password.
  cluster_login_banner:
    type: string
    default: ""
    description: Login banner text.
  ifgrp_name:
    type: string
    default: a0a
    description: >-
      Interface group created on every node that lists data ports. Defaults to
      a0a. Use a name such as a0a or a0b: the letter a, a number from 0 to 999
      with no leading zeros, and one lowercase letter. That node's data ports
      are added to the group. Traffic is distributed by port, and the group
      MTU is set to 9000. In-band management, NFS, and iSCSI VLANs are created
      on this interface group when those VLANs are filled in. This task uses
      the interface group name and the node data ports. Clear this field to
      skip the interface group.
  ifgrp_mode:
    type: string
    default: multimode_lacp
    allowed-values: ["multimode_lacp", "multimode", "singlemode"]
    description: >-
      Interface group mode. Defaults to multimode_lacp. multimode_lacp bundles
      the member ports with LACP, multimode bundles them without LACP, and
      singlemode keeps one port active and uses the others for failover.
      Applied when the group is created.
  ipspace_name:
    type: string
    default: ""
    description: >-
      IPspace for the in-band management, NFS, and iSCSI broadcast domains and
      VLANs. Example: AA02-OCP. The name starts with a letter or underscore.
      Leave this blank to skip IPspace, broadcast domain, and VLAN creation.
      The interface group task does not read this field. The SVM is created
      in this IPspace when an SVM name is set.
  ib_mgmt_vlan_name:
    type: string
    default: ""
    description: >-
      In-band management VLAN name. This name is also the broadcast domain
      name. Example: OCP-BareMetal-MGMT. The broadcast domain MTU is 1500.
      Leave this blank to skip the in-band management broadcast domain.
      The VLAN ID is used only for the VLAN interface.
  ib_mgmt_vlan_id:
    type: string
    default: ""
    description: >-
      In-band management VLAN ID, from 1 to 4094. Example: 1022. ONTAP names
      the interface <interface group>-<VLAN ID>, for example a0a-1022. Leave
      this blank to skip the in-band management VLAN interface. The broadcast
      domain is still created when the VLAN name is set.
  nfs_vlan_name:
    type: string
    default: ""
    description: >-
      NFS VLAN name. Storage protocol NFS. This name is also the broadcast
      domain name. Example: OCP-NFS. The broadcast domain MTU is 9000. Leave
      this blank to skip the NFS broadcast domain. The VLAN ID is used only
      for the VLAN interface.
  nfs_vlan_id:
    type: string
    default: ""
    description: >-
      NFS VLAN ID, from 1 to 4094. Example: 3052. Leave this blank to skip the
      NFS VLAN interface. The broadcast domain is still created when the VLAN
      name is set.
  iscsi_a_vlan_name:
    type: string
    default: ""
    description: >-
      iSCSI VLAN name for fabric A. Storage protocol iSCSI. This name is also
      the broadcast domain name. Example: OCP-iSCSI-A. The broadcast domain
      MTU is 9000. Leave this blank to skip the fabric A broadcast domain.
      The VLAN ID is used only for the VLAN interface.
  iscsi_a_vlan_id:
    type: string
    default: ""
    description: >-
      iSCSI VLAN ID for fabric A, from 1 to 4094. Example: 3012. Leave this
      blank to skip the fabric A VLAN interface. The broadcast domain is still
      created when the VLAN name is set.
  iscsi_b_vlan_name:
    type: string
    default: ""
    description: >-
      iSCSI VLAN name for fabric B. Storage protocol iSCSI. This name is also
      the broadcast domain name. Example: OCP-iSCSI-B. The broadcast domain
      MTU is 9000. Leave this blank to skip the fabric B broadcast domain.
      The VLAN ID is used only for the VLAN interface.
  iscsi_b_vlan_id:
    type: string
    default: ""
    description: >-
      iSCSI VLAN ID for fabric B, from 1 to 4094. Example: 3022. Leave this
      blank to skip the fabric B VLAN interface. The broadcast domain is still
      created when the VLAN name is set.
  svm_name:
    type: string
    default: ""
    description: >-
      SVM name. Example: AA02-OCP-SVM. The name starts with a letter or
      underscore. The SVM is created in the IPspace from Network Configuration,
      and the aggregate names from the node rows are assigned to it. Leave
      this blank to skip SVM creation, the protocol services, the load-sharing
      SnapMirror, the SVM management LIF, the default route,
      vsadmin, the SVM login banner, SVM DNS, the NFS export policy rule,
      and the audit log volume.
  allowed_protocols:
    type: string
    style: multi-select
    default: "[]"
    allowed-values: ["nfs", "iscsi"]
    description: >-
      Protocols allowed on the SVM. The dropdown starts empty. Choose nfs,
      iscsi, or both. The selected license must already be installed on the
      cluster, and every serial for that package must have
      licenses.compliance.state compliant. When license keys or an NLF are
      entered, this check waits for those licenses to be added. The task shows
      the owner, serial number, installed license, expiration, and compliance
      state before the SVM is created. nfs starts the NFS service with
      NFSv3 and NFSv4.1 enabled and UDP disabled. iscsi starts the iSCSI
      service. At least one protocol is required when the SVM name is set.
  job_name:
    type: string
    default: 15min
    description: >-
      Job schedule name used by the load-sharing SnapMirror of the SVM root
      volume. Defaults to 15min. The name starts with a letter, number, or
      underscore. Both this name and the job minutes are required. Clear both
      to skip the mirror volumes, the schedule, and the SnapMirror
      relationship. Set only one and the load-sharing SnapMirror task fails
      at the schedule. The SVM task is already done.
  job_minutes:
    type: string
    default: "0,15,30,45"
    description: >-
      Minutes of each hour when the job schedule runs, separated by commas.
      Defaults to 0,15,30,45, which runs at minute 0, 15, 30, and 45. Other
      15-minute examples are 5,20,35,50 and 7,22,37,52. Each value is a whole
      number from 0 to 59. Both the job name and these minutes are required.
      Clear both to skip the mirror volumes, the schedule, and the SnapMirror
      relationship. Set only one and the load-sharing SnapMirror task fails
      at the schedule. The SVM task is already done.
  vsadmin_password:
    type: string
    sensitive: true
    default: ""
    description: >-
      Password for the SVM vsadmin account. The value is masked. When this is
      filled in, the password is set and vsadmin is unlocked for http, ontapi,
      and ssh. Leave this blank to leave vsadmin unchanged.
  svm_login_banner:
    type: string
    default: ""
    description: Login banner text for the SVM. Leave this blank to skip the SVM banner.
  svm_mgmt_lif_name:
    type: string
    default: ""
    description: >-
      Name of the SVM management LIF. One SVM has one management LIF, so this
      is a single field. Example: svm-mgmt. The name starts with a letter or
      underscore. The LIF is created on the node that hosts the SVM root
      volume, with service policy default-management, admin status up,
      failover policy broadcast-domain-wide, and auto-revert enabled. The
      home port is the in-band management VLAN interface, for example
      a0a-2235. Fill this in together with svm_mgmt_lif_address and
      svm_mgmt_lif_netmask. The interface group name and the in-band
      management VLAN name and VLAN ID must be filled in as well. At least
      one node row must list data ports, because that is where the home
      port is created. With no data ports this task fails before it calls
      the cluster. Leave any of those blank to skip the LIF.
  svm_mgmt_lif_address:
    type: string
    default: ""
    description: >-
      IPv4 address of the SVM management LIF. Example: 10.102.2.50. Fill this
      in together with svm_mgmt_lif_name and svm_mgmt_lif_netmask. Leave it
      blank to skip the LIF.
  svm_mgmt_lif_netmask:
    type: string
    default: ""
    description: >-
      Subnet mask of the SVM management LIF, in dotted decimal form. Example:
      255.255.255.0. Fill this in together with svm_mgmt_lif_name and
      svm_mgmt_lif_address. Leave it blank to skip the LIF.
  svm_mgmt_lif_gateway:
    type: string
    default: ""
    description: >-
      IPv4 gateway for the SVM management LIF. Example: 10.102.2.254. This
      becomes the SVM default route to 0.0.0.0/0 after the management LIF
      is created. It must be different from svm_mgmt_lif_address. Leave it
      blank to skip the default route. If the LIF is skipped, the route is
      skipped as well. The LIF can still be created without it.
  svm_dns_servers:
    type: string
    default: ""
    description: >-
      Comma-separated DNS server IPv4 addresses for the SVM. Example:
      10.1.1.10,10.1.1.11. This is separate from the cluster DNS servers.
      Fill this in together with svm_dns_domain. Leave both blank to skip SVM DNS.
      Set only one and the SVM DNS task fails. This task runs after the
      default route. The default route runs after the management LIF, and
      that LIF runs after the SVM.
  svm_dns_domain:
    type: string
    default: ""
    description: >-
      DNS domain name for the SVM. Example: example.com. This is separate
      from the cluster DNS domain. Fill this in together with svm_dns_servers.
      Leave both blank to skip SVM DNS. Set only one and the SVM DNS task
      fails. This task runs after the default route. The default route runs
      after the management LIF, and that LIF runs after the SVM.
  nfs_client_match:
    type: string
    default: ""
    description: >-
      IPv4 subnet for rule index 1 on the SVM default export policy. Example:
      192.168.52.0/24. Protocol is nfs. Read-only, read-write, and superuser
      security are sys, and suid is allowed. Those values are fixed. The same
      policy is then assigned to the SVM root volume, read from the cluster
      (is_svm_root, or <SVM name>_root with hyphens replaced by underscores).
      Runs after the SVM task. nfs must be selected. Leave this blank to skip
      the rule and the root volume assignment. Leave the SVM name blank to
      skip it with the SVM task.
  audit_log_volume_name:
    type: string
    default: ""
    description: >-
      Name of the FlexVol that stores the SVM audit logs. Example: audit_log.
      The name starts with a letter or underscore and contains only letters,
      numbers, and underscores. The volume is mounted at /<volume name>, and
      SVM auditing uses that same path. Fill this in together with
      audit_log_volume_size_gb and audit_log_aggregate. Leave all three blank
      to skip the volume, the mirror update, and auditing. Set any of them
      and leave one blank and the audit log task fails.
  audit_log_volume_size_gb:
    type: string
    default: ""
    description: >-
      Size of the audit log FlexVol in gigabytes. Enter the number only.
      Example: 50. Use a whole number from 1 to 9999999. The volume is
      online, uses export policy default, has no space guarantee, and has no
      snapshot reserve. Fill this in together with the volume name and
      audit_log_aggregate. Leave all three blank to skip the volume, the
      mirror update, and auditing. Set any of them and leave one blank and
      the audit log task fails.
  audit_log_aggregate:
    type: string
    default: ""
    description: >-
      Aggregate that holds the audit log FlexVol. Example:
      AA02_C800_01_SSD_CAP_1. Use an aggregate name from the node
      configuration rows. This task runs after the SVM task. It creates the
      FlexVol, then refreshes a load-sharing mirror set when one already
      exists, then creates and enables SVM auditing. The volume and the
      audit configuration do not need a SnapMirror relationship. Creating
      the volume with a junction path updates an existing load-sharing set
      automatically. Fill this in together with the volume name
      and audit_log_volume_size_gb. Leave all three blank to skip the volume,
      the mirror refresh, and auditing. Set any of them and leave one blank
      and the task fails. Leave the SVM name blank to skip this with the
      SVM task.

grains:
  pre_validation:
    kind: ansible
    when: '{% if .inputs.ontap_hostname != "" and .inputs.ontap_username != "" and .inputs.ontap_password != "" %}true{% else %}false{% endif %}'
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/pre_validation.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
        - ontap_hostname: '{{ .inputs.ontap_hostname }}'
        - ontap_username: '{{ .inputs.ontap_username }}'
        - ontap_password: '{{ .inputs.ontap_password }}'
        
  update_cluster_location:
    kind: ansible
    when: '{% if .inputs.cluster_name != "" and .inputs.cluster_location != "" %}true{% else %}false{% endif %}'
    depends-on: pre_validation
    spec:
      source:
        store: Stack-Automation-NetApp
        path: assets/ansible/netapp-ontap/update_cluster_location.yaml
      agent:
        name: '{{ .inputs.agent }}'
      inputs:
