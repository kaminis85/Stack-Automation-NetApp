---
- name: Update the ONTAP cluster location
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Validate cluster identity inputs
      ansible.builtin.assert:
        that:
          - cluster_name | default('') | length > 0
          - cluster_location | default('') | length > 0
        fail_msg: Cluster location update needs cluster_name and cluster_location.

    - name: Update the location of the ONTAP cluster
      netapp.ontap.na_ontap_cluster:
        state: present
        cluster_location: "{{ cluster_location }}"
        cluster_name: "{{ cluster_name }}"
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
