---
- name: Delete default ONTAP broadcast domains
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    - name: Count default broadcast domains from per-node port counts
      ansible.builtin.set_fact:
        domain_count: "{{ (node_port_counts.split(',') | map('trim') | reject('equalto', '') | map('int') | sum) * 2 }}"

    - name: Validate the broadcast-domain count
      ansible.builtin.assert:
        that:
          - domain_count | int > 0
        fail_msg: >-
          Provide node_port_counts as comma-separated per-node data port counts,
          for example 2,2.

    - name: Delete the default broadcast domains with node ports
      netapp.ontap.na_ontap_broadcast_domain:
        state: absent
        name: "{{ item }}"
        ipspace: Default
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
      with_sequence: start=1 end="{{ domain_count }}" format=Default-%01x
