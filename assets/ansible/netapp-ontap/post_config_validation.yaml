---
# Creating the interface group makes ONTAP add domains such as Default-1 in
# the Default IPspace, with the interface group as a member. The earlier
# cleanup leaves those in place when they contain a port. This play deletes
# a Default-* domain only when it is in the Default IPspace and one of its
# ports is the interface group. The domain named Default is left in place.
- name: Post Config Validation Tasks
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    ifgrp_name_normalized: "{{ ifgrp_name | default('') | string | trim | lower }}"

  tasks:

    - name: Get broadcast domains in the Default IPspace
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
        use_python_keys: true
        gather_subset:
          - network/ethernet/broadcast-domains
        parameters:
          ipspace.name: Default
        fields:
          - name
          - ipspace
          - ports
      register: default_domain_info
      when: ifgrp_name_normalized | length > 0

    - name: Select Default broadcast domains that contain the interface group
      ansible.builtin.set_fact:
        ifgrp_default_domains: "{{ ifgrp_default_domains | default([]) + [item.name] }}"
      vars:
        port_names: >-
          {{
            item.ports | default([])
            | map(attribute='name')
            | map('lower')
            | list
          }}
      when:
        - ifgrp_name_normalized | length > 0
        - (item.ipspace | default({})).name | default('') == 'Default'
        - item.name is match('^Default-')
        - ifgrp_name_normalized in port_names
      loop: >-
        {{
          (
            (default_domain_info.ontap_info | default({})).network_ethernet_broadcast_domains
            | default({})
          ).records | default([])
        }}
      loop_control:
        label: "{{ item.name | default('unnamed domain') }}"

    - name: Note when no Default broadcast domain for the interface group needs to be deleted
      ansible.builtin.debug:
        msg: >-
          {{
            'No interface group name was provided, so no Default broadcast domain was deleted.'
            if ifgrp_name_normalized | length == 0
            else
            'No Default-* broadcast domain in the Default IPspace contains interface group '
            ~ ifgrp_name_normalized
            ~ ', so nothing was deleted.'
          }}
      when: ifgrp_default_domains | default([]) | length == 0

    - name: Delete Default broadcast domains that contain the interface group
      netapp.ontap.na_ontap_broadcast_domain:
        state: absent
        name: "{{ item }}"
        ipspace: Default
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        use_rest: always
      loop: "{{ ifgrp_default_domains | default([]) | unique }}"
      loop_control:
        label: "{{ item }}"

    - name: Get System Health status
      netapp.ontap.na_ontap_rest_cli:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        command: system/health/status
        verb: GET
        validate_certs: false
      register: health_status

    - name: Verify system health status is not empty
      ansible.builtin.assert:
        that:
          - health_status.msg.status | default('') | length > 0
        fail_msg: "No system health status was returned - cannot validate system health."

    - name: Verify system health status is ok
      ansible.builtin.assert:
        that:
          - health_status.msg.status == 'ok'
        fail_msg: "System health status is not ok! Current status: {{ health_status.msg.status }}"
        success_msg: "System health status is ok."

    - name: Get System health alert
      netapp.ontap.na_ontap_rest_cli:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        command: system/health/alert
        verb: GET
        validate_certs: false
      register: health_alert

    - name: Verify there are no health alerts
      ansible.builtin.assert:
        that:
          - health_alert.msg.num_records == 0
        fail_msg: >
          Health alerts found! Count: {{ health_alert.msg.num_records }}.
          Records: {{ health_alert.msg.records | to_nice_json }}
        success_msg: "No health alerts found."

    - name: Send a test to AutoSupport
      netapp.ontap.na_ontap_autosupport_invoke:
        autosupport_message: "{{ autosupport_message }}"
        type: all
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false

    - name: Pause 30 seconds after sending AutoSupport message
      ansible.builtin.pause:
        seconds: 30

    - name: Wait for AutoSupport collection and transmission to finish
      netapp.ontap.na_ontap_rest_info:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        https: true
        validate_certs: false
        gather_subset:
          - support/autosupport/messages
        fields:
          - 'index'
          - 'state'
          - 'error'
          - 'subject'
          - 'generated_on'
      register: all_asups
      vars:
        asup_records: "{{ all_asups.ontap_info['support/autosupport/messages'].records | default([]) }}"
        latest_index: "{{ asup_records | map(attribute='index') | map('int') | max }}"
        latest_items: "{{ asup_records | selectattr('index', 'equalto', latest_index | int) | list }}"
      until:
        - asup_records | length > 0
        - latest_items | map(attribute='state') | select('in', ['collection_failed', 'sent_successful', 'transmission_failed', 'ondemand_ignore']) | list | length == latest_items | length
      retries: 30
      delay: 10
      ignore_errors: true

    - name: Print the Auto support test status
      ansible.builtin.debug:
        var: latest_items
      vars:
        asup_records: "{{ all_asups.ontap_info['support/autosupport/messages'].records | default([]) }}"
        latest_index: "{{ asup_records | map(attribute='index') | map('int') | max }}"
        latest_items: "{{ asup_records | selectattr('index', 'equalto', latest_index | int) | list }}"

    - name: Verify AutoSupport test status
      ansible.builtin.assert:
        that:
          - latest_items | length > 0
          - failed_items | length == 0
        fail_msg: "AutoSupport FAILED! Failed records: {{ failed_items | to_nice_json }}"
        success_msg: >-
          {% if pending_items | length == 0 and latest_items | map(attribute='state') | unique | list == ['sent_successful'] %}
          AutoSupport PASSED! All {{ latest_items | length }} message(s) with index {{ latest_index }} are sent_successful.
          {% else %}
          AutoSupport has no failures, but not all messages with index {{ latest_index }} are sent_successful. Manually track them. Details: {{ latest_items | to_nice_json }}
          {% endif %}
      vars:
        asup_records: "{{ all_asups.ontap_info['support/autosupport/messages'].records | default([]) }}"
        latest_index: "{{ asup_records | map(attribute='index') | map('int') | max }}"
        latest_items: "{{ asup_records | selectattr('index', 'equalto', latest_index | int) | list }}"
        failed_items: "{{ latest_items | selectattr('state', 'in', ['collection_failed', 'transmission_failed']) | list }}"
        pending_items: "{{ latest_items | rejectattr('state', 'in', ['collection_failed', 'sent_successful', 'transmission_failed', 'ondemand_ignore']) | list }}"

    - name: Get the event logs
      netapp.ontap.na_ontap_rest_cli:
        hostname: "{{ ontap_hostname }}"
        username: "{{ ontap_username }}"
        password: "{{ ontap_password }}"
        command: event/log
        verb: GET
        params:
          severity: "emergency,alert,error"
          fields: event
        validate_certs: false
      register: event_log

    - name: Report error/emergency/alert severity events summary
      ansible.builtin.debug:
        msg: >-
          {% if event_log.msg.num_records > 0 %}
          {{ event_log.msg.num_records }} event(s) of severity error/emergency/alert found. Showing the top 5.
          Review the full list on the cluster with: event log show -severity EMERGENCY,ALERT,ERROR
          {% else %}
          No error/emergency/alert severity events found.
          {% endif %}

    - name: Show the top 5 error/emergency/alert events
      ansible.builtin.debug:
        var: item
      loop: "{{ (event_log.msg.records | default([]))[:5] }}"
      loop_control:
        label: "{{ item.event | default('event') }}"
      when: event_log.msg.num_records > 0